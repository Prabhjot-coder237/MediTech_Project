{% extends 'base.html' %}
{% block content %}
<section class="page-banner"><div class="container"><span class="eyebrow">CONTACT US</span>
    <h1>Contact us</h1><p>Send a message using the form. </p></div></section><section class="section"><div class="container contact-grid"><aside class="info-list"><div class="info-item"><span class="info-icon">📍</span>
        <div><h3>Address</h3><p>ABC Street, City,State</p></div></div>
        <div class="info-item"><span class="info-icon">✉️</span><div><h3>Email</h3><p>info@mediteach.example</p></div></div></aside>
        <form class="form-wrap" method="POST" action="{{ url_for('contact') }}"><h2>Send a message</h2>
            <div class="form-grid"><div class="field full"><label for="name">Your name *</label>
                <input id="name" name="name" value="{{ form_data.get('name','') }}" required></div>
                <div class="field full"><label for="email">Email address *</label>
                    <input id="email" name="email" type="email" value="{{ form_data.get('email','') }}" required></div>
                    <div class="field full"><label for="message">Message *</label>
                        <textarea id="message" name="message" required>{{ form_data.get('message','') }}</textarea></div>
                        <div class="field full"><button class="btn" type="submit">Send Message</button></div>
                    </div>
                    </form>
                    </div>
                    </section>
                        {% endblock %}
