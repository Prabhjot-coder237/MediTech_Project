{% extends 'base.html' %}
{% block content %}
<section class="auth-section"><form class="form-wrap auth-card" method="POST" action="{{ url_for('login') }}">
    <span class="eyebrow">PATIENT ACCOUNT</span>
    <h1 class="auth-title">Login</h1><p class="muted">Log in to access your MediTeach dashboard.</p>
    <div class="field"><label for="email">Email address *</label><input id="email" name="email" type="email" autocomplete="email" required>
    </div>
    <div class="field"><label for="password">Password *</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required></div>
        <button class="btn btn-block" type="submit">Login</button>
        <p class="auth-switch">Don't have an account? <a href="{{ url_for('register') }}">Sign up</a></p></form></section>
        {% endblock %}
